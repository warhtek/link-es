services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: link_es
      POSTGRES_PASSWORD: link_es
      POSTGRES_DB: link_es
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U link_es"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
